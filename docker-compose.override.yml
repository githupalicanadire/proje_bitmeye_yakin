services:
  # Identity Server - Development overrides
  identity.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - ./Services/Identity/Identity.API:/src/Services/Identity/Identity.API
      - /src/Services/Identity/Identity.API/bin
      - /src/Services/Identity/Identity.API/obj
    command: dotnet watch run --no-launch-profile

  # API Gateway - Development overrides
  yarpapigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - ./ApiGateways/YarpApiGateway:/src/ApiGateways/YarpApiGateway
      - /src/ApiGateways/YarpApiGateway/bin
      - /src/ApiGateways/YarpApiGateway/obj
    command: dotnet watch run --no-launch-profile

  # Catalog Service - Development overrides
  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - ./Services/Catalog/Catalog.API:/src/Services/Catalog/Catalog.API
      - /src/Services/Catalog/Catalog.API/bin
      - /src/Services/Catalog/Catalog.API/obj
    command: dotnet watch run --no-launch-profile

  # Basket Service - Development overrides
  basket.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - ./Services/Basket/Basket.API:/src/Services/Basket/Basket.API
      - /src/Services/Basket/Basket.API/bin
      - /src/Services/Basket/Basket.API/obj
    command: dotnet watch run --no-launch-profile

  # Discount gRPC Service - Development overrides
  discount.grpc:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - ./Services/Discount/Discount.Grpc:/src/Services/Discount/Discount.Grpc
      - /src/Services/Discount/Discount.Grpc/bin
      - /src/Services/Discount/Discount.Grpc/obj
    command: dotnet watch run --no-launch-profile

  # Ordering Service - Development overrides
  ordering.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - ./Services/Ordering/Ordering.API:/src/Services/Ordering/Ordering.API
      - /src/Services/Ordering/Ordering.API/bin
      - /src/Services/Ordering/Ordering.API/obj
    command: dotnet watch run --no-launch-profile

  # Database development settings - SADECE OVERRIDE'LAR
  identitydb:
    environment:
      - MSSQL_PID=Developer
    volumes:
      - identity_data:/var/opt/mssql

  catalogdb:
    volumes:
      - catalog_data:/var/lib/postgresql/data

  discountdb:
    environment:
      - MSSQL_PID=Developer
    volumes:
      - discount_data:/var/opt/mssql

  orderingdb:
    environment:
      - MSSQL_PID=Developer
    volumes:
      - ordering_data:/var/opt/mssql

  basketdb:
    volumes:
      - basket_data:/var/lib/postgresql/data

  redis:
    volumes:
      - redis_data:/data

  rabbitmq:
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  identity_data:
  catalog_data:
  discount_data:
  ordering_data:
  basket_data:
  redis_data:
  rabbitmq_data: